name: Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**','js/**','css/**','assets/**','locales/**','scripts/**','index.html','manifest.webmanifest','package*.json','.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build && npm run check && npm run android:assets
      - run: chmod +x android/gradlew && android/gradlew -p android assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: breathe-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
